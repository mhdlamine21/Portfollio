    }
    /* Explicit theme controls for inline SVG or design systems. */
    svg[data-theme="light"] .vl-wordmark,
    svg[data-theme="light"] .vl-tagline { fill: #17334D; }
    svg[data-theme="light"] .vl-start { stop-color: #5060A8; }
    svg[data-theme="light"] .vl-end { stop-color: #22B5B1; }
    svg[data-theme="dark"] .vl-wordmark,
    svg[data-theme="dark"] .vl-tagline { fill: #F2F6FF; }
    svg[data-theme="dark"] .vl-start { stop-color: #8E9DFF; }
    svg[data-theme="dark"] .vl-end { stop-color: #42DDD6; }
    svg[data-monochrome="true"] .vl-icon { fill: currentColor; }
    svg[data-monochrome="true"] .vl-wordmark,
    svg[data-monochrome="true"] .vl-tagline { fill: currentColor; }
  </style>

