<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="vl_globe_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f7f7"/>
      <stop offset="100%" stop-color="#b2eaea"/>
    </radialGradient>
    <linearGradient id="vl_wave_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ab5b5"/>
      <stop offset="100%" stop-color="#1a8f9e"/>
    </linearGradient>
  </defs>

  <!-- White background rounded square -->
  <rect width="200" height="200" rx="28" fill="white"/>

  <!-- Globe outer circle -->
  <circle cx="100" cy="88" r="62" fill="url(#vl_globe_bg)" stroke="#2ab5b5" stroke-width="2.5"/>

  <!-- Globe meridian lines (vertical arcs) -->
  <ellipse cx="100" cy="88" rx="18" ry="62" fill="none" stroke="#2ab5b5" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="100" cy="88" rx="42" ry="62" fill="none" stroke="#2ab5b5" stroke-width="1" opacity="0.4"/>

  <!-- Globe latitude lines (horizontal) -->
  <line x1="38" y1="64" x2="162" y2="64" stroke="#2ab5b5" stroke-width="1.2" opacity="0.5"/>
  <line x1="38" y1="88" x2="162" y2="88" stroke="#2ab5b5" stroke-width="1.5" opacity="0.6"/>
  <line x1="38" y1="112" x2="162" y2="112" stroke="#2ab5b5" stroke-width="1.2" opacity="0.5"/>

  <!-- Sound wave bars in center (overlaid on globe) -->
  <g fill="url(#vl_wave_grad)" opacity="0.92">
    <!-- Left bars (decreasing) -->
    <rect x="64" y="78" width="7" height="20" rx="3.5"/>
    <rect x="74" y="70" width="7" height="36" rx="3.5"/>
    <!-- Center tall bar -->
    <rect x="84" y="62" width="7" height="52" rx="3.5"/>
    <!-- Microphone dot or peak -->
    <rect x="94" y="72" width="7" height="32" rx="3.5"/>
    <!-- Right bars (increasing) -->
    <rect x="104" y="62" width="7" height="52" rx="3.5"/>
    <rect x="114" y="70" width="7" height="36" rx="3.5"/>
    <rect x="124" y="78" width="7" height="20" rx="3.5"/>
  </g>

  <!-- Brand name -->
  <text x="100" y="172" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a8f9e" text-anchor="middle" letter-spacing="0.5">Voicelingo</text>

  <!-- Tagline -->
  <text x="100" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="400" fill="#2ab5b5" text-anchor="middle" letter-spacing="1.5">VOICE · TRANSLATE · CONNECT</text>
</svg>