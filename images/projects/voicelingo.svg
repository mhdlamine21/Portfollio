  <style>
    .vl-wordmark, .vl-tagline { fill: #17334D; }
    .vl-start { stop-color: #5060A8; }
    .vl-end { stop-color: #22B5B1; }
    .vl-icon { fill: url(#vlGradient); }
    .vl-wordmark { font-family: "Inter Display","Inter",system-ui,sans-serif; font-weight: 700; font-size: 108px; letter-spacing: -4.2px; }
