<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="uni_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="uni_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#uni_bg)"/>
  <!-- Mortarboard cap -->
  <polygon points="100,38 165,70 100,88 35,70" fill="url(#uni_gold)"/>
  <!-- Cap top (flat) -->
  <rect x="70" y="35" width="60" height="8" rx="2" fill="#fbbf24"/>
  <!-- Cap tassel cord -->
  <line x1="165" y1="70" x2="165" y2="98" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="165" cy="104" r="6" fill="#fbbf24"/>
  <!-- Gown body -->
  <path d="M65 88 L65 148 Q65 160 80 160 L120 160 Q135 160 135 148 L135 88 Z" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2"/>
  <!-- Gown collar -->
  <path d="M80 88 Q100 105 120 88" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <!-- Book symbol on gown -->
  <rect x="83" y="115" width="34" height="28" rx="3" fill="url(#uni_gold)" opacity="0.85"/>
  <line x1="100" y1="115" x2="100" y2="143" stroke="#1e3a8a" stroke-width="2"/>
  <!-- Stars / sparkles -->
  <text x="40" y="58" font-size="14" fill="#fbbf24" opacity="0.7">✦</text>
  <text x="152" y="140" font-size="10" fill="#fbbf24" opacity="0.5">✦</text>
  <!-- Brand -->
  <text x="100" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">University Sys.</text>
</svg>