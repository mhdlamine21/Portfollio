<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dp_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2140"/>
    </linearGradient>
    <linearGradient id="dp_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#dp_bg)"/>
  <!-- Monitor screen -->
  <rect x="30" y="40" width="140" height="90" rx="8" fill="#0f172a" stroke="url(#dp_accent)" stroke-width="3"/>
  <rect x="38" y="48" width="124" height="74" rx="5" fill="#1e3c5e"/>
  <!-- Screen content: grid of workstation nodes -->
  <circle cx="70" cy="75" r="8" fill="#38bdf8"/>
  <circle cx="100" cy="75" r="8" fill="#38bdf8" opacity="0.7"/>
  <circle cx="130" cy="75" r="8" fill="#22c55e"/>
  <circle cx="70" cy="100" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="100" cy="100" r="8" fill="#38bdf8" opacity="0.5"/>
  <circle cx="130" cy="100" r="8" fill="#ef4444" opacity="0.8"/>
  <!-- Connection lines -->
  <line x1="70" y1="75" x2="100" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="75" x2="130" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="70" y1="75" x2="70" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="75" x2="100" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="130" y1="75" x2="130" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Monitor stand -->
  <rect x="88" y="130" width="24" height="16" rx="2" fill="#1e3a5f"/>
  <rect x="70" y="145" width="60" height="6" rx="3" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
  <!-- Brand text -->
  <text x="100" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">DeskPilot</text>
</svg>