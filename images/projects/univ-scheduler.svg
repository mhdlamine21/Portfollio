<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 285 720 395" width="720" height="395" role="img" aria-label="Univ-Scheduler logo"
     data-theme="auto" data-monochrome="false">
  <title>Univ-Scheduler</title>
  <desc>Logo vectoriel Univ-Scheduler recoloré dans une palette marron, beige et dorée. Sans image incorporée.</desc>
    <style>
    .uv-dark { fill: #4B2E1E; }
    .uv-brown { fill: #7B4C2C; }
    .uv-copper { fill: #A5673B; }
    .uv-beige { fill: #D7B88A; }
    .uv-gold { fill: #D39A43; }
    .uv-cream { fill: #F4E7D4; }
    .uv-light { fill: #E8D4B8; }
    .uv-cream-stroke { stroke: #F4E7D4; }
    svg[data-theme="dark"] .uv-dark { fill: #F1E2CD; }
    svg[data-theme="dark"] .uv-brown { fill: #D2A673; }
    svg[data-theme="dark"] .uv-copper { fill: #C8874F; }
    svg[data-theme="dark"] .uv-beige { fill: #B98A59; }
    svg[data-theme="dark"] .uv-gold { fill: #E2B35B; }
    svg[data-theme="dark"] .uv-cream { fill: #4B2E1E; }
    svg[data-theme="dark"] .uv-light { fill: #6A442B; }
    svg[data-theme="dark"] .uv-cream-stroke { stroke: #4B2E1E; }
    @media (prefers-color-scheme: dark) {
      svg[data-theme="auto"] .uv-dark { fill: #F1E2CD; }
      svg[data-theme="auto"] .uv-brown { fill: #D2A673; }
      svg[data-theme="auto"] .uv-copper { fill: #C8874F; }
      svg[data-theme="auto"] .uv-beige { fill: #B98A59; }
      svg[data-theme="auto"] .uv-gold { fill: #E2B35B; }
      svg[data-theme="auto"] .uv-cream { fill: #4B2E1E; }
      svg[data-theme="auto"] .uv-light { fill: #6A442B; }
      svg[data-theme="auto"] .uv-cream-stroke { stroke: #4B2E1E; }
    }
    svg[data-monochrome="true"] .uv-dark,
    svg[data-monochrome="true"] .uv-brown,
    svg[data-monochrome="true"] .uv-copper,
    svg[data-monochrome="true"] .uv-beige,
    svg[data-monochrome="true"] .uv-gold,
    svg[data-monochrome="true"] .uv-cream,
    svg[data-monochrome="true"] .uv-light {
      fill: currentColor;
    }
    svg[data-monochrome="true"] .uv-cream-stroke { stroke: currentColor; }
  </style>

  <defs>
    <linearGradient id="warmHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B4C2C"/>
      <stop offset="55%" stop-color="#A5673B"/>
      <stop offset="100%" stop-color="#D39A43"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D39A43"/>
      <stop offset="55%" stop-color="#A5673B"/>
      <stop offset="100%" stop-color="#D7B88A"/>
    </linearGradient>
    <linearGradient id="warmCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B88A"/>
      <stop offset="100%" stop-color="#E8D4B8"/>
    </linearGradient>
  </defs>

