<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <radialGradient id="coin_bg" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="60%" stop-color="#b86f3a"/>
      <stop offset="100%" stop-color="#8b4a1e"/>
    </radialGradient>
    <radialGradient id="coin_inner" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c8825a"/>
      <stop offset="100%" stop-color="#a05e30"/>
    </radialGradient>
  </defs>
  <!-- Outer coin border -->
  <circle cx="100" cy="92" r="88" fill="#7a3e18"/>
  <!-- Main coin face -->
  <circle cx="100" cy="92" r="80" fill="url(#coin_bg)"/>
  <!-- Inner ring texture -->
  <circle cx="100" cy="92" r="72" fill="none" stroke="#c47a40" stroke-width="3" stroke-dasharray="8 5"/>
  <!-- Inner coin face -->
  <circle cx="100" cy="92" r="62" fill="url(#coin_inner)"/>
  <!-- Hand/connection symbol (stylised African motif) -->
  <g fill="#5c2a0a" opacity="0.88">
    <!-- Palm base -->
    <ellipse cx="100" cy="104" rx="22" ry="16"/>
    <!-- Thumb -->
    <rect x="72" y="88" width="11" height="7" rx="5" transform="rotate(-20, 77, 91)"/>
    <!-- Finger 1 -->
    <rect x="81" y="70" width="9" height="26" rx="4"/>
    <!-- Finger 2 -->
    <rect x="93" y="66" width="9" height="30" rx="4"/>
    <!-- Finger 3 -->
    <rect x="105" y="68" width="9" height="28" rx="4"/>
    <!-- Finger 4 / pinky -->
    <rect x="117" y="75" width="8" height="22" rx="4"/>
  </g>
  <!-- Shine highlight -->
  <ellipse cx="80" cy="68" rx="18" ry="10" fill="white" opacity="0.12" transform="rotate(-20 80 68)"/>
  <!-- Brand name -->
  <text x="100" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#e07a2f" text-anchor="middle" letter-spacing="1">e-tontine</text>
</svg>